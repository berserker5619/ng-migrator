name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify build, lint, and tests
        run: npm run check

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes || echo "Release already exists, continuing..."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check OIDC environment
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub Actions OIDC token provider is available."
          else
            echo "WARNING: ACTIONS_ID_TOKEN_REQUEST_URL is empty!"
          fi

      - name: Publish package to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing via NPM_TOKEN..."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            npm publish --access public
          else
            echo "Publishing via OIDC Trusted Publishing with provenance..."
            npm publish --provenance --access public
          fi
