name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag to publish to (default: next; set to latest for stable)'
        required: true
        default: 'next'
        type: choice
        options:
          - next
          - latest

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify build, lint, and tests
        run: npm run check

      - name: Guard against duplicate publish and determine npm dist-tag
        id: prep
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package version in manifest: $PKG_VERSION"
          if npm view "ng-migrator@$PKG_VERSION" version --json >/dev/null 2>&1; then
            echo "::error::Version $PKG_VERSION is already published on npm! Bump version before releasing."
            exit 1
          fi
          # Default to 'next' tag unless workflow_dispatch explicitly chose 'latest'
          DIST_TAG="${{ github.event.inputs.npm_tag || 'next' }}"
          echo "publish_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing ng-migrator@$PKG_VERSION with dist-tag: $DIST_TAG"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes || echo "Release already exists, continuing..."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check OIDC environment
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub Actions OIDC token provider is available."
          else
            echo "WARNING: ACTIONS_ID_TOKEN_REQUEST_URL is empty!"
          fi

      - name: Publish package to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing via NPM_TOKEN..."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            npm publish --access public --tag "${{ steps.prep.outputs.publish_tag }}"
          else
            echo "Publishing via OIDC Trusted Publishing with provenance..."
            npm publish --provenance --access public --tag "${{ steps.prep.outputs.publish_tag }}"
          fi
