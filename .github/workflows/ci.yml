name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the built CLI
        run: node dist/cli.js --version
      - name: Fresh-machine tarball install test
        shell: bash
        run: |
          PACK_DIR="$(mktemp -d)"
          TGZ="$(npm pack --pack-destination "$PACK_DIR" | tail -n 1)"
          mkdir -p "$PACK_DIR/consumer"
          cd "$PACK_DIR/consumer"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund "$PACK_DIR/$TGZ"
          npx ng-migrator --version
          npx ng-migrator --help
          rm -rf "$PACK_DIR"
